<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <!-- Bear Fur Gradients -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#dee2e6"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffccd5"/>
      <stop offset="100%" stop-color="#ff758f"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff758f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffccd5" stop-opacity="0"/>
    </radialGradient>

    <!-- Academic Mortarboard Cap Gradients -->
    <linearGradient id="capBoardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3a4a"/>
      <stop offset="45%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <linearGradient id="capBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0a1118"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e09f3e"/>
    </linearGradient>

    <linearGradient id="ribbonRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="50%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9b2226"/>
    </linearGradient>

    <linearGradient id="diplomaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fffdf0"/>
      <stop offset="100%" stop-color="#fefae0"/>
    </linearGradient>

    <radialGradient id="irisLight" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#457b9d" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#1d3557" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="specularRim" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="academicGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#ffd166" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d3557" flood-opacity="0.2"/>
    </filter>

    <style>
      @keyframes bearSpringJump {
        0% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
        9% { transform: translateY(11px) scale(1.15, 0.85) rotate(0deg); }
        22% { transform: translateY(-16px) scale(0.88, 1.15) rotate(1deg); }
        36% { transform: translateY(-44px) scale(0.93, 1.09) rotate(2deg); }
        48% { transform: translateY(-47px) scale(1.02, 0.98) rotate(0.6deg); }
        64% { transform: translateY(-12px) scale(0.89, 1.14) rotate(-0.8deg); }
        74% { transform: translateY(13px) scale(1.24, 0.76) rotate(0deg); }
        84% { transform: translateY(-10px) scale(0.93, 1.08) rotate(-0.5deg); }
        92% { transform: translateY(3px) scale(1.04, 0.97) rotate(0.2deg); }
        100% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
      }

      @keyframes groundShadowSpring {
        0% { transform: scale(1, 1); opacity: 0.38; }
        9% { transform: scale(1.28, 1.22); opacity: 0.55; }
        22% { transform: scale(0.74, 0.68); opacity: 0.20; }
        36%, 48% { transform: scale(0.44, 0.40); opacity: 0.08; }
        64% { transform: scale(0.80, 0.74); opacity: 0.22; }
        74% { transform: scale(1.36, 1.30); opacity: 0.65; }
        84% { transform: scale(0.86, 0.82); opacity: 0.26; }
        92% { transform: scale(1.07, 1.05); opacity: 0.44; }
        100% { transform: scale(1, 1); opacity: 0.38; }
      }

      @keyframes earLeftSpring {
        0% { transform: rotate(0deg); }
        22% { transform: rotate(-14deg); }
        36% { transform: rotate(12deg); }
        64% { transform: rotate(-10deg); }
        74% { transform: rotate(16deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes earRightSpring {
        0% { transform: rotate(0deg); }
        22% { transform: rotate(14deg); }
        36% { transform: rotate(-12deg); }
        64% { transform: rotate(10deg); }
        74% { transform: rotate(-16deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes tasselSway {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-18deg); }
        50% { transform: rotate(6deg); }
        75% { transform: rotate(-12deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes eyeBlink {
        0%, 94%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.08); }
      }

      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.7; }
        50% { transform: scale(1.25) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 6px #ffd166); }
      }

      .bear-motion-anim {
        animation: bearSpringJump 3.2s cubic-bezier(0.28, 0, 0.22, 1) infinite;
        transform-origin: 140px 172px;
      }

      .shadow-motion-anim {
        animation: groundShadowSpring 3.2s cubic-bezier(0.28, 0, 0.22, 1) infinite;
        transform-origin: 140px 222px;
      }

      .ear-left-anim {
        animation: earLeftSpring 3.2s cubic-bezier(0.33, 0, 0.2, 1) infinite;
        transform-origin: 104px 80px;
      }

      .ear-right-anim {
        animation: earRightSpring 3.2s cubic-bezier(0.33, 0, 0.2, 1) infinite;
        transform-origin: 176px 80px;
      }

      .tassel-anim {
        animation: tasselSway 3.2s ease-in-out infinite;
        transform-origin: 140px 62px;
      }

      .eye-blink-anim {
        animation: eyeBlink 4s infinite;
        transform-origin: 140px 114px;
      }

      .star-1 { animation: starTwinkle 2.4s ease-in-out infinite; transform-origin: 45px 65px; }
      .star-2 { animation: starTwinkle 2.8s ease-in-out infinite 0.8s; transform-origin: 235px 70px; }
      .star-3 { animation: starTwinkle 2.1s ease-in-out infinite 1.4s; transform-origin: 220px 150px; }
    </style>
  </defs>

  <!-- Dynamic Soft Ground Shadow -->
  <ellipse cx="140" cy="222" rx="55" ry="12" fill="#1b263b" class="shadow-motion-anim"/>

  <!-- Celebratory Ambient Academic Gold Stars -->
  <g class="star-1">
    <polygon points="45,55 48,62 55,65 48,68 45,75 42,68 35,65 42,62" fill="url(#goldGrad)"/>
    <circle cx="45" cy="65" r="1.5" fill="#ffffff"/>
  </g>
  <g class="star-2">
    <polygon points="235,60 238,67 245,70 238,73 235,80 232,73 225,70 232,67" fill="url(#goldGrad)"/>
    <circle cx="235" cy="70" r="1.5" fill="#ffffff"/>
  </g>
  <g class="star-3">
    <polygon points="220,142 222,147 228,150 222,153 220,158 218,153 212,150 218,147" fill="url(#goldGrad)"/>
  </g>

  <!-- Main Animated Character Rig -->
  <g class="bear-motion-anim" filter="url(#academicGlow)">
    
    <!-- Bear Body -->
    <ellipse cx="140" cy="158" rx="42" ry="46" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2.5"/>
    <!-- Soft Belly -->
    <ellipse cx="140" cy="164" rx="28" ry="30" fill="url(#bellyGrad)"/>

    <!-- Bear Feet -->
    <ellipse cx="112" cy="198" rx="15" ry="10" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2"/>
    <ellipse cx="112" cy="198" rx="8" ry="5" fill="#ffccd5" opacity="0.6"/>
    <ellipse cx="168" cy="198" rx="15" ry="10" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2"/>
    <ellipse cx="168" cy="198" rx="8" ry="5" fill="#ffccd5" opacity="0.6"/>

    <!-- Bear Ears with Spring Rig -->
    <g class="ear-left-anim">
      <circle cx="104" cy="78" r="18" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2.5"/>
      <circle cx="104" cy="78" r="10" fill="url(#innerEarGrad)"/>
      <path d="M 89 74 C 95 67 110 67 117 75 C 111 70 97 70 89 74 Z" fill="url(#specularRim)" opacity="0.9"/>
    </g>
    <g class="ear-right-anim">
      <circle cx="176" cy="78" r="18" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2.5"/>
      <circle cx="176" cy="78" r="10" fill="url(#innerEarGrad)"/>
      <path d="M 163 74 C 169 67 184 67 191 75 C 185 70 171 70 163 74 Z" fill="url(#specularRim)" opacity="0.9"/>
    </g>

    <!-- Bear Head -->
    <circle cx="140" cy="116" r="48" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2.5"/>
    <ellipse cx="140" cy="95" rx="28" ry="14" fill="#ffffff" opacity="0.45"/>
    <path d="M 100 96 C 110 76 138 71 162 76 C 145 78 122 83 110 99 C 104 107 100 117 98 126 C 96 115 97 104 100 96 Z" fill="url(#specularRim)" opacity="0.85"/>

    <!-- Graduation Mortarboard (Cap) -->
    <!-- Cap Base / Skullcap -->
    <path d="M 112 76 Q 140 68 168 76 L 166 88 Q 140 94 114 88 Z" fill="url(#capBaseGrad)" stroke="#0d1b2a" stroke-width="1.5"/>
    <path d="M 116 78 Q 140 72 164 78" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>

    <!-- Cap Mortarboard Diamond Top -->
    <polygon points="140,42 196,58 140,74 84,58" fill="url(#capBoardGrad)" stroke="#0d1b2a" stroke-width="2"/>
    <!-- Specular Bevel Highlights on Mortarboard Edge -->
    <polygon points="140,42 196,58 191,60 140,45" fill="#ffffff" opacity="0.4"/>
    <polygon points="140,42 84,58 89,60 140,45" fill="#ffffff" opacity="0.25"/>

    <!-- Center Gold Button on Mortarboard -->
    <ellipse cx="140" cy="58" rx="4" ry="2.5" fill="url(#goldGrad)"/>
    <circle cx="139" cy="57" r="1.2" fill="#ffffff" opacity="0.9"/>

    <!-- Flowing Golden Tassel -->
    <g class="tassel-anim">
      <!-- Tassel Ribbon Cord -->
      <path d="M 140 58 Q 170 56 178 72 L 180 94" fill="none" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M 140 58 Q 170 56 178 72 L 180 94" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <!-- Tassel Ring Clip -->
      <circle cx="180" cy="94" r="3.2" fill="url(#goldGrad)"/>
      <!-- Hanging Tassel Fringe -->
      <polygon points="176,95 184,95 186,112 174,112" fill="url(#goldGrad)"/>
      <line x1="177" y1="96" x2="177" y2="111" stroke="#e09f3e" stroke-width="1"/>
      <line x1="180" y1="96" x2="180" y2="111" stroke="#ffffff" stroke-width="1"/>
      <line x1="183" y1="96" x2="183" y2="111" stroke="#e09f3e" stroke-width="1"/>
    </g>

    <!-- Facial Features -->
    <g class="eye-blink-anim">
      <!-- Left Eye -->
      <g transform="translate(118, 114)">
        <ellipse cx="0" cy="0" rx="6.8" ry="8.8" fill="#1b263b"/>
        <ellipse cx="0" cy="3" rx="5" ry="3.5" fill="url(#irisLight)"/>
        <ellipse cx="-2.3" cy="-3.2" rx="3" ry="3.8" fill="#ffffff"/>
        <circle cx="2.6" cy="3.2" r="1.4" fill="#ffffff"/>
        <circle cx="-3" cy="1.5" r="0.8" fill="#ffffff" opacity="0.8"/>
        <path d="M -4.5 3.5 Q 0 7.5 4.5 3.5" stroke="#457b9d" stroke-width="1.2" fill="none" opacity="0.8"/>
      </g>
      <!-- Right Eye -->
      <g transform="translate(162, 114)">
        <ellipse cx="0" cy="0" rx="6.8" ry="8.8" fill="#1b263b"/>
        <ellipse cx="0" cy="3" rx="5" ry="3.5" fill="url(#irisLight)"/>
        <ellipse cx="-2.3" cy="-3.2" rx="3" ry="3.8" fill="#ffffff"/>
        <circle cx="2.6" cy="3.2" r="1.4" fill="#ffffff"/>
        <circle cx="-3" cy="1.5" r="0.8" fill="#ffffff" opacity="0.8"/>
        <path d="M -4.5 3.5 Q 0 7.5 4.5 3.5" stroke="#457b9d" stroke-width="1.2" fill="none" opacity="0.8"/>
      </g>
    </g>

    <!-- Blushing Rosy Cheeks -->
    <circle cx="110" cy="126" r="13" fill="url(#blushGrad)"/>
    <circle cx="170" cy="126" r="13" fill="url(#blushGrad)"/>
    <ellipse cx="107" cy="123" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="111" cy="125" r="1" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="173" cy="123" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="169" cy="125" r="1" fill="#ffffff" opacity="0.6"/>

    <!-- Snout & Nose -->
    <ellipse cx="140" cy="126" rx="14" ry="10" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5"/>
    <ellipse cx="140" cy="122" rx="5.8" ry="3.8" fill="#1b263b"/>
    <ellipse cx="138" cy="120.6" rx="2.4" ry="1.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="141.5" cy="121.2" r="0.7" fill="#ffffff" opacity="0.75"/>
    <!-- Cute Proud W-Mouth Smile -->
    <path d="M 140 125.5 Q 134 133 129 129" fill="none" stroke="#1b263b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 140 125.5 Q 146 133 151 129" fill="none" stroke="#1b263b" stroke-width="2" stroke-linecap="round"/>

    <!-- Bear Paws & Tied Diploma Scroll -->
    <!-- Left Paw -->
    <ellipse cx="112" cy="164" rx="12" ry="10" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2"/>
    <ellipse cx="110" cy="161" rx="5" ry="2.5" fill="#ffffff" opacity="0.65"/>

    <!-- Diploma Scroll Centerpiece -->
    <g transform="translate(140, 162) rotate(-5) translate(-140, -162)">
      <!-- Main Rolled Parchment -->
      <rect x="108" y="152" width="64" height="20" rx="4" fill="url(#diplomaGrad)" stroke="#d4af37" stroke-width="1.4"/>
      <!-- Curled Parchment Edges -->
      <path d="M 108 152 Q 105 162 108 172" stroke="#b08968" stroke-width="1.5" fill="none"/>
      <ellipse cx="108" cy="162" rx="2" ry="9" fill="#f5ebe0" stroke="#b08968" stroke-width="1"/>
      <path d="M 172 152 Q 175 162 172 172" stroke="#b08968" stroke-width="1.5" fill="none"/>
      <ellipse cx="172" cy="162" rx="2" ry="9" fill="#fffdf0" stroke="#b08968" stroke-width="1"/>
      
      <!-- Elegant Red Satin Ribbon Tied Around Diploma -->
      <rect x="136" y="150" width="8" height="24" rx="1.5" fill="url(#ribbonRedGrad)"/>
      <!-- Ribbon Specular Highlight -->
      <line x1="137.5" y1="151" x2="137.5" y2="173" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>
      <!-- Golden Honor Seal Stamp -->
      <circle cx="140" cy="162" r="5.5" fill="url(#goldGrad)" stroke="#c28b18" stroke-width="0.8"/>
      <polygon points="140,158 141,161 144,162 141,163 140,166 139,163 136,162 139,161" fill="#ffffff"/>
      <!-- Ribbon Hanging Tails -->
      <path d="M 138 165 Q 134 174 130 180 L 135 178 L 138 181 Z" fill="url(#ribbonRedGrad)"/>
      <path d="M 142 165 Q 146 174 150 180 L 145 178 L 142 181 Z" fill="url(#ribbonRedGrad)"/>
    </g>

    <!-- Right Paw -->
    <ellipse cx="168" cy="164" rx="12" ry="10" fill="url(#furGrad)" stroke="#ced4da" stroke-width="2"/>
    <ellipse cx="166" cy="161" rx="5" ry="2.5" fill="#ffffff" opacity="0.65"/>

  </g>
</svg>
