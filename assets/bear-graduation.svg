<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240" role="img" aria-label="Graduation bear celebrating"> <defs> <!-- ── Fur & body ───────────────────────────────────── --> <linearGradient id="gb-fur" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#FFFDF8"/> <stop offset="0.5" stop-color="#FAF3E6"/> <stop offset="1" stop-color="#EADDC6"/> </linearGradient> <radialGradient id="gb-belly" cx="0.5" cy="0.34" r="0.68"> <stop offset="0" stop-color="#FFFDF9"/> <stop offset="0.6" stop-color="#F8F1E2"/> <stop offset="1" stop-color="#E6D8C0"/> </radialGradient> <linearGradient id="gb-ear" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#FBD9DE"/> <stop offset="1" stop-color="#E294A1"/> </linearGradient> <radialGradient id="gb-blush" cx="0.5" cy="0.5" r="0.5"> <stop offset="0" stop-color="#F08A8A" stop-opacity="0.5"/> <stop offset="0.55" stop-color="#F5A7A7" stop-opacity="0.24"/> <stop offset="1" stop-color="#FBD5D5" stop-opacity="0"/> </radialGradient> <linearGradient id="gb-rim" x1="0" y1="0" x2="0.85" y2="1"> <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/> <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.3"/> <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/> </linearGradient> <!-- ── Eyes ─────────────────────────────────────────── --> <radialGradient id="gb-iris" cx="0.5" cy="0.85" r="0.72"> <stop offset="0" stop-color="#44749C"/> <stop offset="0.55" stop-color="#223F5D"/> <stop offset="1" stop-color="#101B29"/> </radialGradient> <!-- ── Academic regalia ─────────────────────────────── --> <linearGradient id="gb-board" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#34485E"/> <stop offset="0.5" stop-color="#1F2E40"/> <stop offset="1" stop-color="#0F1A25"/> </linearGradient> <linearGradient id="gb-capbase" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#26394D"/> <stop offset="1" stop-color="#0D151E"/> </linearGradient> <linearGradient id="gb-gold" x1="0" y1="0" x2="0.8" y2="1"> <stop offset="0" stop-color="#FFF3C4"/> <stop offset="0.45" stop-color="#F6C85C"/> <stop offset="1" stop-color="#C8912B"/> </linearGradient> <linearGradient id="gb-ribbon" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#C94A5A"/> <stop offset="0.5" stop-color="#A32B3C"/> <stop offset="1" stop-color="#74161F"/> </linearGradient> <linearGradient id="gb-parch" x1="0" y1="0" x2="0.3" y2="1"> <stop offset="0" stop-color="#FFFDF6"/> <stop offset="0.55" stop-color="#FBF3E2"/> <stop offset="1" stop-color="#EFE2C8"/> </linearGradient> <radialGradient id="gb-ground" cx="0.5" cy="0.5" r="0.5"> <stop offset="0" stop-color="#1B263B" stop-opacity="0.45"/> <stop offset="0.6" stop-color="#1B263B" stop-opacity="0.22"/> <stop offset="1" stop-color="#1B263B" stop-opacity="0"/> </radialGradient> <filter id="gb-lift" x="-30%" y="-30%" width="160%" height="160%"> <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1B263B" flood-opacity="0.16"/> </filter> <style> @keyframes gbJump { 0% { transform: translateY(0) scale(1, 1) rotate(0deg); } 9% { transform: translateY(11px) scale(1.14, 0.86) rotate(0deg); } 22% { transform: translateY(-18px) scale(0.89, 1.14) rotate(1deg); } 36% { transform: translateY(-44px) scale(0.94, 1.08) rotate(2deg); } 48% { transform: translateY(-47px) scale(1.02, 0.98) rotate(0.6deg); } 64% { transform: translateY(-12px) scale(0.9, 1.13) rotate(-0.8deg); } 74% { transform: translateY(13px) scale(1.22, 0.78) rotate(0deg); } 84% { transform: translateY(-10px) scale(0.94, 1.07) rotate(-0.5deg); } 92% { transform: translateY(3px) scale(1.04, 0.97) rotate(0.2deg); } 100% { transform: translateY(0) scale(1, 1) rotate(0deg); } } @keyframes gbShadow { 0% { transform: scale(1, 1); opacity: 0.38; } 9% { transform: scale(1.26, 1.2); opacity: 0.56; } 22% { transform: scale(0.76, 0.7); opacity: 0.2; } 36%,48% { transform: scale(0.46, 0.42); opacity: 0.09; } 64% { transform: scale(0.82, 0.76); opacity: 0.23; } 74% { transform: scale(1.34, 1.28); opacity: 0.64; } 84% { transform: scale(0.88, 0.84); opacity: 0.27; } 92% { transform: scale(1.06, 1.04); opacity: 0.43; } 100% { transform: scale(1, 1); opacity: 0.38; } } @keyframes gbEarL { 0%, 100% { transform: rotate(0deg); } 22% { transform: rotate(-13deg); } 36% { transform: rotate(11deg); } 64% { transform: rotate(-9deg); } 74% { transform: rotate(15deg); } } @keyframes gbEarR { 0%, 100% { transform: rotate(0deg); } 22% { transform: rotate(13deg); } 36% { transform: rotate(-11deg); } 64% { transform: rotate(9deg); } 74% { transform: rotate(-15deg); } } @keyframes gbTassel { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-14deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(-9deg); } } @keyframes gbBlink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } } @keyframes gbTwinkle { 0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.62; } 50% { transform: scale(1.2) rotate(18deg); opacity: 1; } } .gb-bear { animation: gbJump 3.2s cubic-bezier(0.28, 0, 0.22, 1) infinite; transform-origin: 140px 172px; } .gb-shadow { animation: gbShadow 3.2s cubic-bezier(0.28, 0, 0.22, 1) infinite; transform-origin: 140px 220px; } .gb-ear-l { animation: gbEarL 3.2s cubic-bezier(0.33, 0, 0.2, 1) infinite; transform-origin: 116px 92px; } .gb-ear-r { animation: gbEarR 3.2s cubic-bezier(0.33, 0, 0.2, 1) infinite; transform-origin: 164px 92px; } .gb-tassel { animation: gbTassel 3.2s ease-in-out infinite; transform-origin: 140px 58px; } .gb-eyes { animation: gbBlink 4.2s infinite; transform-origin: 140px 112px; } .gb-sp1 { animation: gbTwinkle 2.6s ease-in-out infinite; transform-origin: 48px 62px; } .gb-sp2 { animation: gbTwinkle 3s ease-in-out infinite 0.9s; transform-origin: 234px 72px; } .gb-sp3 { animation: gbTwinkle 2.2s ease-in-out infinite 1.5s; transform-origin: 222px 152px; } </style> </defs> <!-- Ground shadow --> <ellipse class="gb-shadow" cx="140" cy="220" rx="56" ry="12" fill="url(#gb-ground)"/> <!-- Ambient sparkles --> <g class="gb-sp1"> <path d="M 48 53 C 49.5 59.3 50.7 60.5 57 62 C 50.7 63.5 49.5 64.7 48 71 C 46.5 64.7 45.3 63.5 39 62 C 45.3 60.5 46.5 59.3 48 53 Z" fill="url(#gb-gold)"/> </g> <g class="gb-sp2"> <path d="M 234 64 C 235.3 69.6 236.4 70.7 242 72 C 236.4 73.3 235.3 74.4 234 80 C 232.7 74.4 231.6 73.3 226 72 C 231.6 70.7 232.7 69.6 234 64 Z" fill="url(#gb-gold)"/> </g> <g class="gb-sp3"> <path d="M 222 146 C 223 150.2 223.8 151 228 152 C 223.8 153 223 153.8 222 158 C 221 153.8 220.2 153 216 152 C 220.2 151 221 150.2 222 146 Z" fill="url(#gb-gold)"/> </g> <circle cx="62" cy="100" r="1.8" fill="#F6C85C" opacity="0.55"/> <circle cx="212" cy="98" r="1.5" fill="#F6C85C" opacity="0.45"/> <!-- Animated character rig --> <g class="gb-bear" filter="url(#gb-lift)"> <!-- Body --> <ellipse cx="140" cy="162" rx="40" ry="44" fill="url(#gb-fur)"/> <ellipse cx="140" cy="162" rx="40" ry="44" fill="none" stroke="#E2D5BE" stroke-width="1.6"/> <ellipse cx="140" cy="170" rx="27" ry="29" fill="url(#gb-belly)"/> <!-- Feet --> <ellipse cx="112" cy="201" rx="15" ry="10" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.6"/> <ellipse cx="112" cy="202" rx="8" ry="5" fill="#F2A9B4" opacity="0.5"/> <ellipse cx="168" cy="201" rx="15" ry="10" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.6"/> <ellipse cx="168" cy="202" rx="8" ry="5" fill="#F2A9B4" opacity="0.5"/> <!-- Ears (spring rig) --> <g class="gb-ear-l"> <circle cx="110" cy="78" r="17" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.6"/> <circle cx="110" cy="79" r="9.5" fill="url(#gb-ear)"/> </g> <g class="gb-ear-r"> <circle cx="170" cy="78" r="17" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.6"/> <circle cx="170" cy="79" r="9.5" fill="url(#gb-ear)"/> </g> <!-- Head --> <ellipse cx="140" cy="113" rx="46" ry="43" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.6"/> <path d="M 100 118 C 101 94 116 78 138 72 C 118 80 105 97 104 120 Z" fill="url(#gb-rim)" opacity="0.5"/> <!-- Cheeks --> <circle cx="106" cy="126" r="13" fill="url(#gb-blush)"/> <circle cx="174" cy="126" r="13" fill="url(#gb-blush)"/> <!-- Snout, nose, mouth --> <ellipse cx="140" cy="127" rx="15.5" ry="11.5" fill="#FFFCF6"/> <ellipse cx="140" cy="127" rx="15.5" ry="11.5" fill="none" stroke="#EFE4D2" stroke-width="1"/> <ellipse cx="140" cy="122" rx="6.2" ry="4.2" fill="#1B2735"/> <ellipse cx="138" cy="120.6" rx="2.4" ry="1.2" fill="#FFFFFF" opacity="0.9"/> <circle cx="141.8" cy="121.4" r="0.8" fill="#FFFFFF" opacity="0.65"/> <path d="M 140 126 L 140 128.4" stroke="#1B2735" stroke-width="1.8" stroke-linecap="round" fill="none"/> <path d="M 140 128.4 C 137 132.8 132.5 132.8 129.8 129.6" stroke="#1B2735" stroke-width="1.8" stroke-linecap="round" fill="none"/> <path d="M 140 128.4 C 143 132.8 147.5 132.8 150.2 129.6" stroke="#1B2735" stroke-width="1.8" stroke-linecap="round" fill="none"/> <!-- Eyes --> <g class="gb-eyes"> <g transform="translate(118,112)"> <ellipse cx="0" cy="0" rx="7" ry="9" fill="#16212E"/> <ellipse cx="0" cy="2.6" rx="5.4" ry="5.6" fill="url(#gb-iris)"/> <ellipse cx="-2.4" cy="-3.4" rx="3.1" ry="3.9" fill="#FFFFFF" opacity="0.95"/> <circle cx="2.6" cy="3.2" r="1.5" fill="#FFFFFF" opacity="0.85"/> <circle cx="-3.1" cy="1.8" r="0.9" fill="#FFFFFF" opacity="0.7"/> </g> <g transform="translate(162,112)"> <ellipse cx="0" cy="0" rx="7" ry="9" fill="#16212E"/> <ellipse cx="0" cy="2.6" rx="5.4" ry="5.6" fill="url(#gb-iris)"/> <ellipse cx="-2.4" cy="-3.4" rx="3.1" ry="3.9" fill="#FFFFFF" opacity="0.95"/> <circle cx="2.6" cy="3.2" r="1.5" fill="#FFFFFF" opacity="0.85"/> <circle cx="-3.1" cy="1.8" r="0.9" fill="#FFFFFF" opacity="0.7"/> </g> </g> <!-- Cap skullcap band --> <path d="M 106 84 C 116 76 164 76 174 84 C 177 92 176 99 172 103 C 158 108 122 108 108 103 C 104 99 103 92 106 84 Z" fill="url(#gb-capbase)"/> <path d="M 110 86 C 120 79 160 79 170 86" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.16"/> <!-- Mortarboard -->
  <path d="M 140 41 C 158 46 180 52 198 58 C 180 64 158 70 140 75 C 122 70 100 64 82 58 C 100 52 122 46 140 41 Z" fill="url(#gb-board)" stroke="#0C141C" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 140 42.6 L 84.5 58 L 88 59.6 L 140 45.2 Z" fill="#FFFFFF" opacity="0.24"/>
  <path d="M 140 42.6 L 195.5 58 L 192 59.6 L 140 45.2 Z" fill="#FFFFFF" opacity="0.11"/>
  <ellipse cx="140" cy="58" rx="4.5" ry="3" fill="url(#gb-gold)"/>
  <ellipse cx="139.2" cy="57.1" rx="1.6" ry="0.9" fill="#FFFFFF" opacity="0.85"/>

  <!-- Tassel --> <g class="gb-tassel"> <path d="M 140 58 C 158 57 176 61 184 72 C 190 80 191 88 190 95" fill="none" stroke="url(#gb-gold)" stroke-width="2.6" stroke-linecap="round"/> <path d="M 140 58 C 158 57 176 61 184 72 C 190 80 191 88 190 95" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/> <circle cx="190" cy="96" r="3.2" fill="url(#gb-gold)"/> <path d="M 185 96 L 195 96 L 195 112 Q 190 116 185 112 Z" fill="url(#gb-gold)"/> <path d="M 186.6 97.5 L 186.6 113" stroke="#C8912B" stroke-width="0.9" opacity="0.7"/> <path d="M 190 97.5 L 190 114.2" stroke="#FFFFFF" stroke-width="0.9" opacity="0.55"/> <path d="M 193.4 97.5 L 193.4 113" stroke="#C8912B" stroke-width="0.9" opacity="0.7"/> </g> <!-- Diploma --> <g transform="rotate(-6 140 164)"> <rect x="107" y="154" width="66" height="20" rx="3.5" fill="url(#gb-parch)" stroke="#DCC28C" stroke-width="1"/> <ellipse cx="107" cy="164" rx="3" ry="10" fill="#F6EAD3" stroke="#DCC28C" stroke-width="0.9"/> <ellipse cx="173" cy="164" rx="3" ry="10" fill="#FFFDF6" stroke="#DCC28C" stroke-width="0.9"/> <rect x="136" y="152" width="8" height="24" rx="1.4" fill="url(#gb-ribbon)"/> <line x1="137.6" y1="153.5" x2="137.6" y2="174.5" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/> <circle cx="140" cy="164" r="5.8" fill="url(#gb-gold)" stroke="#B8871F" stroke-width="0.8"/> <path d="M 140 161 L 140.9 163.1 L 143 164 L 140.9 164.9 L 140 167 L 139.1 164.9 L 137 164 L 139.1 163.1 Z" fill="#FFFFFF" opacity="0.95"/> <path d="M 139 167 Q 135 175 131 181 L 135.5 179 L 138.5 182 Z" fill="url(#gb-ribbon)"/> <path d="M 141 167 Q 145 175 149 181 L 144.5 179 L 141.5 182 Z" fill="url(#gb-ribbon)"/> </g> <!-- Paws holding the diploma --> <ellipse cx="113" cy="167" rx="12" ry="10" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.5"/> <ellipse cx="111" cy="164" rx="5" ry="2.4" fill="#FFFFFF" opacity="0.5"/> <ellipse cx="167" cy="167" rx="12" ry="10" fill="url(#gb-fur)" stroke="#E2D5BE" stroke-width="1.5"/> <ellipse cx="165" cy="164" rx="5" ry="2.4" fill="#FFFFFF" opacity="0.5"/> </g> </svg>
