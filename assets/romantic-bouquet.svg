<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240" aria-label="Romantic Flower Bouquet Illustration">
  <defs>
    <!-- Soft Background Ambient Glow -->
    <radialGradient id="rbq-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4ea" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ffd1dc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground Contact Shadow -->
    <radialGradient id="rbq-contact-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#803344" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#803344" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#803344" stop-opacity="0"/>
    </radialGradient>

    <!-- Bouquet Paper Wrap Gradient -->
    <linearGradient id="rbq-wrap-main" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff8f6"/>
      <stop offset="45%" stop-color="#f7e5e1"/>
      <stop offset="100%" stop-color="#eed1cb"/>
    </linearGradient>
    <linearGradient id="rbq-wrap-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2ef"/>
      <stop offset="100%" stop-color="#e3c2bc"/>
    </linearGradient>

    <!-- Satin Velvet Ribbon -->
    <linearGradient id="rbq-ribbon-velvet" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#e63956"/>
      <stop offset="40%" stop-color="#ba1a38"/>
      <stop offset="85%" stop-color="#800f26"/>
      <stop offset="100%" stop-color="#540817"/>
    </linearGradient>
    <linearGradient id="rbq-ribbon-highlight" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="50%" stop-color="#e63956"/>
      <stop offset="100%" stop-color="#99132e"/>
    </linearGradient>

    <!-- Central Grand Rose Shading -->
    <linearGradient id="rbq-rose-deep" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e83652"/>
      <stop offset="45%" stop-color="#bf1335"/>
      <stop offset="85%" stop-color="#7a0a1f"/>
      <stop offset="100%" stop-color="#4a0411"/>
    </linearGradient>
    <linearGradient id="rbq-rose-petal-light" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ff7b93"/>
      <stop offset="60%" stop-color="#e02b48"/>
      <stop offset="100%" stop-color="#a30f28"/>
    </linearGradient>

    <!-- Pastel Peach Peony -->
    <linearGradient id="rbq-peony-peach" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffecd6"/>
      <stop offset="45%" stop-color="#fca8a4"/>
      <stop offset="85%" stop-color="#e3636f"/>
      <stop offset="100%" stop-color="#aa2840"/>
    </linearGradient>

    <!-- Cream Tea Rose -->
    <linearGradient id="rbq-tea-rose" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff0f3"/>
      <stop offset="80%" stop-color="#fec5bb"/>
      <stop offset="100%" stop-color="#e28c9b"/>
    </linearGradient>

    <!-- Botanical Foliage (Eucalyptus and Rose Leaf) -->
    <linearGradient id="rbq-leaf-eucalyptus" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#84a98c"/>
      <stop offset="55%" stop-color="#52796f"/>
      <stop offset="100%" stop-color="#2f3e46"/>
    </linearGradient>
    <linearGradient id="rbq-leaf-fresh" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>

  <style>
    /* Organic, physically grounded idle motion */
    @keyframes rbqSwayBody {
      0%, 100% {
        transform: rotate(-1.5deg) translateY(0px);
      }
      50% {
        transform: rotate(1.8deg) translateY(-3px);
      }
    }

    @keyframes rbqRibbonLagL {
      0%, 100% {
        transform: rotate(-2deg);
      }
      50% {
        transform: rotate(4deg);
      }
    }

    @keyframes rbqRibbonLagR {
      0%, 100% {
        transform: rotate(3deg);
      }
      50% {
        transform: rotate(-3.5deg);
      }
    }

    @keyframes rbqPetalBreathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.028);
      }
    }

    @keyframes rbqDriftingPetal {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translate(-38px, 42px) rotate(48deg);
        opacity: 0;
      }
    }

    @keyframes rbqGlint {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.85);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.15);
      }
    }

    .rbq-stem-bouquet {
      animation: rbqSwayBody 5.2s cubic-bezier(0.445, 0.05, 0.55, 0.95) infinite;
      transform-origin: 140px 200px;
    }

    .rbq-ribbon-left {
      animation: rbqRibbonLagL 5.2s cubic-bezier(0.45, 0, 0.55, 1) infinite 0.22s;
      transform-origin: 135px 172px;
    }

    .rbq-ribbon-right {
      animation: rbqRibbonLagR 5.2s cubic-bezier(0.45, 0, 0.55, 1) infinite 0.35s;
      transform-origin: 145px 172px;
    }

    .rbq-petal-pulse {
      animation: rbqPetalBreathe 4.6s ease-in-out infinite;
      transform-origin: 140px 105px;
    }

    .rbq-petal-drift {
      animation: rbqDriftingPetal 4.8s cubic-bezier(0.33, 1, 0.68, 1) infinite;
    }

    .rbq-glint-spark {
      animation: rbqGlint 3.2s ease-in-out infinite;
      transform-origin: 148px 94px;
    }

    /* Accessibility: Respect Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .rbq-stem-bouquet,
      .rbq-ribbon-left,
      .rbq-ribbon-right,
      .rbq-petal-pulse,
      .rbq-petal-drift,
      .rbq-glint-spark {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>

  <!-- Ambient Backdrop -->
  <circle cx="140" cy="116" r="94" fill="url(#rbq-ambient-glow)"/>
  <ellipse cx="140" cy="216" rx="46" ry="7" fill="url(#rbq-contact-shadow)"/>

  <!-- Subtle Drifting Petal with air drag -->
  <g class="rbq-petal-drift" transform="translate(176, 76)">
    <path d="M0,0 C6,-8 18,-4 16,8 C14,16 2,18 -2,10 C-4,4 -3,2 0,0 Z" fill="url(#rbq-rose-petal-light)" opacity="0.85"/>
  </g>

  <!-- Main Articulated Bouquet Group -->
  <g class="rbq-stem-bouquet">
    <!-- Bouquet Wrapping Paper (Folded Textured Cornucopia) -->
    <!-- Base Kraft Cone -->
    <path d="M140,210 L102,130 C122,134 158,134 178,130 Z" fill="url(#rbq-wrap-main)" stroke="#e4bfb7" stroke-width="1.2"/>
    <!-- Fold Lapels with Dimensional Shadow -->
    <path d="M102,130 L140,210 L122,142 Z" fill="url(#rbq-wrap-fold)" opacity="0.85"/>
    <path d="M178,130 L140,210 L158,142 Z" fill="#edd6d1" opacity="0.9"/>
    <!-- Paper Crease Highlights -->
    <path d="M140,210 L139,150" stroke="#ffffff" stroke-width="1.4" opacity="0.6" stroke-linecap="round"/>

    <!-- Foliage / Botanical Greenery (Background Layer) -->
    <!-- Eucalyptus Round Leaves (Left) -->
    <g transform="translate(98, 120) rotate(-24)">
      <path d="M0,15 C-12,5 -14,-15 -2,-20 C10,-24 18,-8 12,8 Z" fill="url(#rbq-leaf-eucalyptus)"/>
      <path d="M0,15 Q3,-5 0,-18" stroke="#415a77" stroke-width="1" fill="none" opacity="0.6"/>
      <ellipse cx="-1" cy="-6" rx="9" ry="12" fill="#a4c3b2" opacity="0.35"/>
    </g>
    <!-- Eucalyptus Round Leaves (Right) -->
    <g transform="translate(182, 120) rotate(24)">
      <path d="M0,15 C12,5 14,-15 2,-20 C-10,-24 -18,-8 -12,8 Z" fill="url(#rbq-leaf-eucalyptus)"/>
      <path d="M0,15 Q-3,-5 0,-18" stroke="#415a77" stroke-width="1" fill="none" opacity="0.6"/>
      <ellipse cx="1" cy="-6" rx="9" ry="12" fill="#a4c3b2" opacity="0.35"/>
    </g>

    <!-- Deep Green Rose Leaves -->
    <path d="M110,126 C90,110 88,88 104,96 C115,102 118,118 110,126 Z" fill="url(#rbq-leaf-fresh)"/>
    <path d="M104,96 Q108,112 110,126" stroke="#1b4332" stroke-width="1.2" fill="none"/>

    <path d="M170,126 C190,110 192,88 176,96 C165,102 162,118 170,126 Z" fill="url(#rbq-leaf-fresh)"/>
    <path d="M176,96 Q172,112 170,126" stroke="#1b4332" stroke-width="1.2" fill="none"/>

    <!-- Baby's Breath and Delicate Sprigs (Top Accent) -->
    <g opacity="0.95">
      <path d="M140,94 Q132,68 126,56" stroke="#52796f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="126" cy="56" r="3.2" fill="#ffffff" stroke="#ffccd5" stroke-width="0.8"/>
      <circle cx="132" cy="66" r="2.6" fill="#fff0f3"/>

      <path d="M140,94 Q148,68 154,56" stroke="#52796f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="154" cy="56" r="3.2" fill="#ffffff" stroke="#ffccd5" stroke-width="0.8"/>
      <circle cx="148" cy="66" r="2.6" fill="#fff0f3"/>

      <path d="M140,92 L140,50" stroke="#52796f" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="140" cy="49" r="3.5" fill="#ffffff" stroke="#ffccd5" stroke-width="0.8"/>
    </g>

    <!-- Left Flower: Pastel Peach Peony -->
    <g transform="translate(112, 108)">
      <!-- Outer Peony Petals -->
      <path d="M-18,-8 C-22,-22 4,-26 12,-16 C20,-6 18,14 4,18 C-10,22 -24,8 -18,-8 Z" fill="url(#rbq-peony-peach)"/>
      <path d="M-12,-12 C-14,-22 2,-20 8,-12 C14,-4 10,12 -2,12 C-10,12 -16,0 -12,-12 Z" fill="#ffa69e" opacity="0.85"/>
      <!-- Soft Peony Inner Ruffles -->
      <path d="M-8,-4 C-6,-14 6,-14 8,-4 C10,4 2,8 -2,8 C-6,8 -10,4 -8,-4 Z" fill="#ff758f"/>
      <path d="M-4,-2 C-3,-8 4,-8 5,-2 C6,3 1,5 -1,5 C-3,5 -5,3 -4,-2 Z" fill="#c9184a"/>
      <!-- Top Rim Highlight -->
      <path d="M-14,-14 C-6,-22 6,-20 12,-10" stroke="#fff1e6" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Right Flower: Elegant Cream Tea Rose -->
    <g transform="translate(168, 108)">
      <!-- Outer Cream Petals -->
      <path d="M-12,-16 C-4,-26 22,-22 18,-8 C24,8 10,22 -4,18 C-18,14 -20,-6 -12,-16 Z" fill="url(#rbq-tea-rose)"/>
      <path d="M-8,-12 C-2,-20 16,-16 14,-6 C18,6 6,14 -4,12 C-12,10 -14,0 -8,-12 Z" fill="#fff5f5"/>
      <!-- Warm Blush Center -->
      <path d="M-6,-4 C-2,-12 10,-10 8,-2 C10,6 2,10 -3,8 C-7,6 -8,2 -6,-4 Z" fill="#f4978e"/>
      <path d="M-3,-1 C-1,-6 6,-5 5,-1 C6,3 1,5 -2,4 C-4,3 -4,1 -3,-1 Z" fill="#d90429"/>
      <!-- Silk Petal Edge Highlight -->
      <path d="M-8,-16 C2,-24 16,-18 16,-8" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Center Blossom: Grand Velvet Heritage Rose (Focal Point) -->
    <g class="rbq-petal-pulse" transform="translate(140, 105)">
      <!-- Deep Petal Shadow Silhouette -->
      <path d="M-28,-8 C-24,-30 24,-30 28,-8 C34,14 16,32 -2,32 C-20,32 -34,14 -28,-8 Z" fill="url(#rbq-rose-deep)"/>

      <!-- Layered Petal Shells -->
      <path d="M-22,-14 C-14,-28 16,-28 22,-14 C28,2 14,24 -2,24 C-18,24 -26,2 -22,-14 Z" fill="url(#rbq-rose-petal-light)"/>
      <path d="M-16,-18 C-8,-28 14,-24 18,-12 C22,2 10,18 -2,18 C-14,18 -20,4 -16,-18 Z" fill="#c9184a"/>

      <!-- Cupped Front Petal Folds -->
      <path d="M-18,2 C-14,18 14,18 18,2 C12,12 -12,12 -18,2 Z" fill="#ff4d6d"/>
      <path d="M-14,-6 C-8,-16 12,-16 14,-4 C16,8 6,14 -2,14 C-10,14 -16,4 -14,-6 Z" fill="url(#rbq-rose-petal-light)"/>

      <!-- Velvet Rose Spiral Core -->
      <path d="M-8,-4 C-6,-12 6,-12 8,-4 C9,4 3,9 -1,9 C-5,9 -9,4 -8,-4 Z" fill="#540817"/>
      <path d="M-4,-2 C-3,-7 4,-7 5,-2 C6,3 1,5 -1,5 C-3,5 -5,2 -4,-2 Z" fill="#ba1a38"/>
      <circle cx="-0.5" cy="0.5" r="2.2" fill="#2b0008"/>

      <!-- Dewdrop Glint -->
      <g class="rbq-glint-spark">
        <circle cx="8" cy="-11" r="2" fill="#ffffff" opacity="0.95"/>
        <circle cx="9" cy="-10.5" r="0.8" fill="#ffd166"/>
      </g>
    </g>

    <!-- Satin Velvet Ribbon Bow Tie (Tied at Bouquet Neck) -->
    <!-- Center Knot -->
    <g transform="translate(140, 168)">
      <!-- Left Bow Loop -->
      <path d="M0,-2 C-18,-18 -32,2 -8,6 C-2,7 0,0 0,-2 Z" fill="url(#rbq-ribbon-velvet)"/>
      <path d="M-2,-1 C-14,-13 -24,1 -8,4 Z" fill="url(#rbq-ribbon-highlight)" opacity="0.75"/>

      <!-- Right Bow Loop -->
      <path d="M0,-2 C18,-18 32,2 8,6 C2,7 0,0 0,-2 Z" fill="url(#rbq-ribbon-velvet)"/>
      <path d="M2,-1 C14,-13 24,1 8,4 Z" fill="url(#rbq-ribbon-highlight)" opacity="0.75"/>

      <!-- Velvet Knot Core with Dimension -->
      <ellipse cx="0" cy="2" rx="6.5" ry="5.5" fill="#7a081e" stroke="#e63956" stroke-width="0.8"/>
      <ellipse cx="-1.5" cy="0.5" rx="3.5" ry="2.2" fill="#ff758f" opacity="0.6"/>

      <!-- Graceful Flowing Tails with Believable Inertia -->
      <g class="rbq-ribbon-left">
        <path d="M-4,5 C-12,18 -18,28 -22,40 L-13,38 L-7,26 C-4,18 -2,9 -4,5 Z" fill="url(#rbq-ribbon-velvet)"/>
        <path d="M-5,7 C-10,18 -15,28 -18,37" stroke="#ff758f" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round"/>
      </g>
      <g class="rbq-ribbon-right">
        <path d="M4,5 C12,18 18,28 22,40 L13,38 L7,26 C4,18 2,9 4,5 Z" fill="url(#rbq-ribbon-velvet)"/>
        <path d="M5,7 C10,18 15,28 18,37" stroke="#ff758f" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
