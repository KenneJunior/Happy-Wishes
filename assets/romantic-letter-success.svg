<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240" aria-label="Romantic Love Letter Celebration Illustration">
  <defs>
    <!-- Warm Golden Love Celebration Backdrop Glow -->
    <radialGradient id="rlts-golden-aura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ffe4ec" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffd1dc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Illuminating Halo -->
    <radialGradient id="rlts-halo-glow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#fff9db" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffd166" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Cotton Rag Letter Parchment (Warm Cream) -->
    <linearGradient id="rlts-parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fffcf8"/>
      <stop offset="100%" stop-color="#f7efe4"/>
    </linearGradient>

    <!-- Envelope Body (Blush Paper with Gold Foil Trim) -->
    <linearGradient id="rlts-envelope" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="45%" stop-color="#fddae2"/>
      <stop offset="100%" stop-color="#f8bec9"/>
    </linearGradient>

    <!-- Starlight Gold Gradient -->
    <linearGradient id="rlts-gold-gleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffeaa7"/>
      <stop offset="75%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#b76e00"/>
    </linearGradient>

    <!-- Radiant Velvet Ruby Heart -->
    <linearGradient id="rlts-ruby-heart" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ff5c7e"/>
      <stop offset="35%" stop-color="#d90429"/>
      <stop offset="75%" stop-color="#800216"/>
      <stop offset="100%" stop-color="#400008"/>
    </linearGradient>

    <!-- Ground Contact Shadow -->
    <radialGradient id="rlts-contact-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a1e34" stop-opacity="0.2"/>
      <stop offset="65%" stop-color="#7a1e34" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7a1e34" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Finite Letter Reveal Choreography -> Peaceful Resting State */
    @keyframes rltsLetterReveal {
      0% {
        transform: scale(0.92) translateY(8px);
        opacity: 0.85;
      }
      35% {
        transform: scale(1.06) translateY(-8px);
      }
      65% {
        transform: scale(0.985) translateY(-2px);
      }
      85% {
        transform: scale(1.012) translateY(-4px);
      }
      100% {
        transform: scale(1) translateY(-3px);
      }
    }

    @keyframes rltsPaperRise {
      0% {
        transform: translateY(22px) scale(0.94);
      }
      50% {
        transform: translateY(-8px) scale(1.03);
      }
      100% {
        transform: translateY(0px) scale(1);
      }
    }

    @keyframes rltsSettledBreathe {
      0%, 100% {
        transform: translateY(-3px) scale(1);
      }
      50% {
        transform: translateY(-5.5px) scale(1.012);
      }
    }

    @keyframes rltsHaloRadiance {
      0% { transform: scale(0.7); opacity: 0; }
      50% { transform: scale(1.16); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.6; }
    }

    @keyframes rltsStarSparkle {
      0% { transform: scale(0); opacity: 0; }
      45% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 0.85; }
    }

    .rlts-envelope-container {
      animation: rltsLetterReveal 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 rltsSettledBreathe 5.2s ease-in-out infinite 1.4s;
      transform-origin: 140px 150px;
    }

    .rlts-paper-layer {
      animation: rltsPaperRise 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
      transform-origin: 140px 100px;
    }

    .rlts-halo {
      animation: rltsHaloRadiance 1.6s ease-out forwards;
      transform-origin: 140px 86px;
    }

    .rlts-star-1 {
      animation: rltsStarSparkle 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.35s;
      transform-origin: 70px 60px;
    }
    .rlts-star-2 {
      animation: rltsStarSparkle 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.5s;
      transform-origin: 210px 54px;
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      .rlts-envelope-container,
      .rlts-paper-layer,
      .rlts-halo,
      .rlts-star-1,
      .rlts-star-2 {
        animation: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }
  </style>

  <!-- Ambient Backdrop -->
  <circle cx="140" cy="116" r="102" fill="url(#rlts-golden-aura)"/>
  <circle class="rlts-halo" cx="140" cy="86" r="76" fill="url(#rlts-halo-glow)"/>
  <ellipse cx="140" cy="216" rx="58" ry="7" fill="url(#rlts-contact-shadow)"/>

  <!-- Golden Starlight Accents -->
  <g class="rlts-star-1">
    <path d="M70,52 Q70,60 62,60 Q70,60 70,68 Q70,60 78,60 Q70,60 70,52 Z" fill="url(#rlts-gold-gleam)"/>
    <circle cx="70" cy="60" r="1.4" fill="#ffffff"/>
  </g>
  <g class="rlts-star-2">
    <path d="M210,46 Q210,54 202,54 Q210,54 210,62 Q210,54 218,54 Q210,54 210,46 Z" fill="url(#rlts-gold-gleam)"/>
    <circle cx="210" cy="54" r="1.4" fill="#ffffff"/>
  </g>

  <!-- Main Envelope and Revealed Letter Group -->
  <g class="rlts-envelope-container">
    <!-- Back Envelope Pocket -->
    <rect x="68" y="112" width="144" height="88" rx="10" fill="#f4b8c5"/>

    <!-- Rising Parchment Love Letter (Focal Point) -->
    <g class="rlts-paper-layer" transform="translate(76, 52)">
      <!-- Fine Cotton Sheet -->
      <rect x="0" y="0" width="128" height="96" rx="8" fill="url(#rlts-parchment)" stroke="#ecd8c8" stroke-width="1.2"/>
      
      <!-- Gold Foil Border Inset on Parchment -->
      <rect x="4" y="4" width="120" height="88" rx="6" fill="none" stroke="#ffd166" stroke-width="0.9" stroke-dasharray="8 4" opacity="0.8"/>

      <!-- Radiant Centerpiece Love Heart Emblem on Letter -->
      <g transform="translate(64, 38)">
        <path d="M0,-8 C0,-20 16,-28 28,-14 C40,0 40,16 16,34 L0,48 L-16,34 C-40,16 -40,0 -28,-14 C-16,-28 0,-20 0,-8 Z" fill="url(#rlts-ruby-heart)"/>
        <!-- Golden Rim Line on Heart -->
        <path d="M0,-8 C0,-20 16,-28 28,-14 C40,0 40,16 16,34 L0,48 L-16,34 C-40,16 -40,0 -28,-14 C-16,-28 0,-20 0,-8 Z" 
              stroke="#ffd166" stroke-width="1.4" fill="none" opacity="0.85"/>
        <!-- Specular Highlight Arc -->
        <path d="M-16,0 C-22,8 -22,18 -18,24" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.85"/>
        <circle cx="-14" cy="-3" r="1.6" fill="#ffffff"/>
      </g>

      <!-- Handwritten Elegant Sentiment Lines Below Heart -->
      <path d="M22,78 Q64,76 106,78" stroke="#b51739" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M34,86 Q64,85 94,86" stroke="#d63f60" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Side Fold Flaps -->
    <path d="M68,112 L140,158 L68,200 Z" fill="#fbd1dc"/>
    <path d="M212,112 L140,158 L212,200 Z" fill="#fbd1dc"/>

    <!-- Bottom Envelope Flap -->
    <path d="M68,200 L140,152 L212,200 Z" fill="url(#rlts-envelope)" stroke="#f7bcc8" stroke-width="1"/>
    <!-- Fold Highlights -->
    <path d="M68,200 L140,152 L212,200" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.6"/>

    <!-- Open Envelope Lapel Trim (Gold Accent) -->
    <path d="M68,112 L140,78 L212,112" stroke="#ffd166" stroke-width="1.2" fill="none" opacity="0.75"/>

    <!-- Wax Seal Remnant with Heart Brooch -->
    <g transform="translate(140, 156)">
      <circle cx="0" cy="0" r="10" fill="#a01030"/>
      <path d="M0,-3 C0,-7 5,-9 8,-6 C11,-3 11,1 6,5 L0,8 L-6,5 C-11,1 -11,-3 -8,-6 C-5,-9 0,-7 0,-3 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="4" cy="-4" r="1.2" fill="#ffd166"/>
    </g>
  </g>
</svg>
