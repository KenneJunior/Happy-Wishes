<!-- assets/romantic-sunset-success.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sky & Twilight Gradient -->
    <linearGradient id="rsns-sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e0617" />
      <stop offset="30%" stop-color="#240f34" />
      <stop offset="60%" stop-color="#5c193c" />
      <stop offset="85%" stop-color="#a83258" />
      <stop offset="100%" stop-color="#f27d63" />
    </linearGradient>

    <!-- Celestial Moon Radiant Glow -->
    <radialGradient id="rsns-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fef0d7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f39db0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#5c193c" stop-opacity="0" />
    </radialGradient>

    <!-- Water Surface Gradient -->
    <linearGradient id="rsns-water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42122d" />
      <stop offset="25%" stop-color="#290a1f" />
      <stop offset="65%" stop-color="#170414" />
      <stop offset="100%" stop-color="#0a010a" />
    </linearGradient>

    <!-- Success Heart Water Reflection -->
    <radialGradient id="rsns-heart-light-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#f43f5e" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#881337" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#170414" stop-opacity="0" />
    </radialGradient>

    <!-- Swan Base Gradient Left -->
    <linearGradient id="rsns-swan-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fff1f5" />
      <stop offset="70%" stop-color="#f4a5ba" />
      <stop offset="100%" stop-color="#a04f68" />
    </linearGradient>

    <!-- Swan Base Gradient Right -->
    <linearGradient id="rsns-swan-right-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fff1f5" />
      <stop offset="70%" stop-color="#f4a5ba" />
      <stop offset="100%" stop-color="#a04f68" />
    </linearGradient>

    <!-- Wing Highlight Gradient -->
    <linearGradient id="rsns-wing-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.3" />
    </linearGradient>

    <!-- Beak Gradient -->
    <linearGradient id="rsns-beak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <style>
    /* Finite Success Choreography -> Settles into subtle ambient float */
    .rsns-swan-left-main {
    animation: rsnsGlideLeft 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .rsns-swan-right-main {
    animation: rsnsGlideRight 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .rsns-heart-reflection-group {
    animation: rsnsHeartBloom 4s ease-out forwards;
    }
    .rsns-celestial-pulse {
    animation: rsnsMoonBloom 3.5s ease-out forwards;
    }

    /* Ambient float applied after glide completes */
    .rsns-swan-left-neck {
    animation: rsnsNeckFloatL 6s ease-in-out 3.5s infinite alternate;
    transform-origin: 345px 290px;
    }
    .rsns-swan-right-neck {
    animation: rsnsNeckFloatR 6.5s ease-in-out 3.5s infinite alternate;
    transform-origin: 455px 290px;
    }

    @keyframes rsnsGlideLeft {
    0% { transform: translateX(0px); }
    100% { transform: translateX(18px); }
    }
    @keyframes rsnsGlideRight {
    0% { transform: translateX(0px); }
    100% { transform: translateX(-18px); }
    }
    @keyframes rsnsHeartBloom {
    0% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 0.9; transform: scale(1.08); }
    100% { opacity: 0.8; transform: scale(1); }
    }
    @keyframes rsnsMoonBloom {
    0% { opacity: 0.5; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes rsnsNeckFloatL {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(1deg); }
    }
    @keyframes rsnsNeckFloatR {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-1deg); }
    }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
    .rsns-swan-left-main,
    .rsns-swan-right-main,
    .rsns-heart-reflection-group,
    .rsns-celestial-pulse,
    .rsns-swan-left-neck,
    .rsns-swan-right-neck {
    animation: none !important;
    transform: none !important;
    opacity: 1 !important;
    }
    .rsns-swan-left-main { transform: translateX(18px) !important; }
    .rsns-swan-right-main { transform: translateX(-18px) !important; }
    }
  </style>

  <!-- 1. Background Sky -->
  <rect width="800" height="300" fill="url(#rsns-sky-grad)" />

  <!-- 2. Distant Horizon Mountain Silhouettes -->
  <path d="M 0 300 L 0 282 Q 130 268 260 278 T 540 272 Q 700 262 800 278 L 800 300 Z" fill="#320c25" opacity="0.85" />
  <path d="M 0 300 L 0 288 Q 190 278 390 286 T 720 280 L 800 288 L 800 300 Z" fill="#1d0417" />

  <!-- 3. Celestial Moon / Intensified Radiant Glow -->
  <g class="rsns-celestial-pulse" transform-origin="400px 210px">
    <circle cx="400" cy="210" r="180" fill="url(#rsns-moon-glow)" />
    <circle cx="400" cy="205" r="32" fill="#ffffff" />
    <circle cx="400" cy="205" r="45" fill="#fef3c7" opacity="0.5" />
  </g>

  <!-- 4. Water Base -->
  <rect x="0" y="295" width="800" height="205" fill="url(#rsns-water-grad)" />

  <!-- 5. SUCCESS PAYOFF: Soft Heart-Shaped Light Reflection in Water -->
  <g class="rsns-heart-reflection-group" transform-origin="400px 370px">
    <!-- Outer Radiant Glow -->
    <ellipse cx="400" cy="370" rx="180" ry="60" fill="url(#rsns-heart-light-glow)" />

    <!-- Organic Water-Reflected Heart Contour -->
    <path d="M 400 385
             C 370 360 340 335 365 320
             C 385 308 400 328 400 328
             C 400 328 415 308 435 320
             C 460 335 430 360 400 385 Z"
          fill="#fef08a" opacity="0.45" filter="blur(3px)" />

    <!-- Water Ripple Striations intersecting the heart reflection -->
    <g stroke="#fef08a" stroke-opacity="0.5" stroke-linecap="round" stroke-width="1.2">
      <line x1="330" y1="330" x2="470" y2="330" />
      <line x1="310" y1="345" x2="490" y2="345" />
      <line x1="340" y1="360" x2="460" y2="360" />
      <line x1="365" y1="372" x2="435" y2="372" />
    </g>
  </g>

  <!-- Water Surface Reflections of Swans -->
  <g opacity="0.6">
    <!-- Left Swan Reflection -->
    <path d="M 248 330 C 278 360 348 360 378 340 C 368 375 298 380 248 345 Z" fill="#751a3d" filter="blur(2px)" />
    <!-- Right Swan Reflection -->
    <path d="M 552 330 C 522 360 452 360 422 340 C 432 375 502 380 552 345 Z" fill="#751a3d" filter="blur(2px)" />
  </g>

  <!-- ==================== 6. LEFT SWAN (Glides slightly right) ==================== -->
  <g class="rsns-swan-left-main">
    <!-- Body & Tail -->
    <path d="M 210 305
             C 190 295 180 280 175 265
             C 188 275 205 288 225 292
             C 200 280 195 260 195 250
             C 212 265 230 280 250 285
             C 270 250 330 255 355 285
             C 370 305 365 328 335 332
             C 285 338 235 325 210 305 Z"
          fill="url(#rsns-swan-left-grad)" />

    <!-- Wing Layer -->
    <path d="M 220 285
             C 240 260 285 252 325 270
             C 345 280 350 298 330 310
             C 290 318 245 308 220 285 Z"
          fill="url(#rsns-wing-highlight)" />
    <path d="M 240 282
             C 260 265 295 260 325 278
             C 310 298 275 302 240 282 Z"
          fill="#ffffff" opacity="0.65" />

    <!-- Chest Ripple -->
    <path d="M 335 328 C 350 330 365 325 375 322" stroke="#fbcfe8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9" />

    <!-- Neck & Head Assembly -->
    <g class="rsns-swan-left-neck">
      <!-- S-Curve Neck -->
      <path d="M 338 298
               C 365 285 372 235 352 195
               C 342 175 352 155 368 152
               C 382 150 388 165 378 185
               C 362 218 388 275 348 315 Z"
            fill="url(#rsns-swan-left-grad)" />

      <!-- Head Structure -->
      <path d="M 362 154
               C 360 144 372 138 384 145
               C 392 150 395 160 386 166
               C 376 170 365 165 362 154 Z"
            fill="#ffffff" />

      <!-- Basal Knob & Mask -->
      <path d="M 382 148 C 386 146 389 149 388 153 C 385 156 381 155 380 151 Z" fill="#180e15" />

      <!-- Beak (Maintains intentional gap, no beak-to-beak contact) -->
      <path d="M 387 153 L 406 161 C 401 166 394 167 386 162 Z" fill="url(#rsns-beak-grad)" />

      <!-- Eye -->
      <circle cx="378" cy="151" r="1.8" fill="#180e15" />
      <circle cx="377.6" cy="150.4" r="0.6" fill="#ffffff" />
    </g>
  </g>

  <!-- ==================== 7. RIGHT SWAN (Glides slightly left) ==================== -->
  <g class="rsns-swan-right-main">
    <!-- Body & Tail -->
    <path d="M 590 305
             C 610 295 620 280 625 265
             C 612 275 595 288 575 292
             C 600 280 605 260 605 250
             C 588 265 570 280 550 285
             C 530 250 470 255 445 285
             C 430 305 435 328 465 332
             C 515 338 565 325 590 305 Z"
          fill="url(#rsns-swan-right-grad)" />

    <!-- Wing Layer -->
    <path d="M 580 285
             C 560 260 515 252 475 270
             C 455 280 450 298 470 310
             C 510 318 555 308 580 285 Z"
          fill="url(#rsns-wing-highlight)" />
    <path d="M 560 282
             C 540 265 505 260 475 278
             C 490 298 525 302 560 282 Z"
          fill="#ffffff" opacity="0.65" />

    <!-- Chest Ripple -->
    <path d="M 465 328 C 450 330 435 325 425 322" stroke="#fbcfe8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9" />

    <!-- Neck & Head Assembly -->
    <g class="rsns-swan-right-neck">
      <!-- S-Curve Neck -->
      <path d="M 462 298
               C 435 285 428 235 448 195
               C 458 175 448 155 432 152
               C 418 150 412 165 422 185
               C 438 218 412 275 452 315 Z"
            fill="url(#rsns-swan-right-grad)" />

      <!-- Head Structure -->
      <path d="M 438 154
               C 440 144 428 138 416 145
               C 408 150 405 160 414 166
               C 424 170 435 165 438 154 Z"
            fill="#ffffff" />

      <!-- Basal Knob & Mask -->
      <path d="M 418 148 C 414 146 411 149 412 153 C 415 156 419 155 420 151 Z" fill="#180e15" />

      <!-- Beak (Maintains intentional gap, no beak-to-beak contact) -->
      <path d="M 413 153 L 394 161 C 399 166 406 167 414 162 Z" fill="url(#rsns-beak-grad)" />

      <!-- Eye -->
      <circle cx="422" cy="151" r="1.8" fill="#180e15" />
      <circle cx="422.4" cy="150.4" r="0.6" fill="#ffffff" />
    </g>
  </g>

  <!-- 8. Foreground Soft Edge -->
  <rect x="0" y="480" width="800" height="20" fill="#040105" opacity="0.8" />
</svg>
