<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="cupidSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0ea"/>
      <stop offset="100%" stop-color="#fed5c8"/>
    </linearGradient>
    <linearGradient id="cupidHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe899"/>
      <stop offset="60%" stop-color="#f8b84e"/>
      <stop offset="100%" stop-color="#e08d23"/>
    </linearGradient>
    <linearGradient id="cupidWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffe5ed"/>
      <stop offset="100%" stop-color="#ffb3c6"/>
    </linearGradient>
    <linearGradient id="goldBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e69c24"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="50%" stop-color="#ff0a54"/>
      <stop offset="100%" stop-color="#a4133c"/>
    </linearGradient>
    <radialGradient id="victoryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff477e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes cheerCupid {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(-2deg); }
    }
    @keyframes heartBurst {
      0% { transform: scale(0.6) translateY(0); opacity: 0.2; }
      50% { transform: scale(1.15) translateY(-14px); opacity: 1; }
      100% { transform: scale(0.9) translateY(-26px); opacity: 0; }
    }
    .cupid-cheer {
      animation: cheerCupid 1.8s ease-in-out infinite;
      transform-origin: 140px 140px;
    }
    .burst-1 { animation: heartBurst 2.2s ease-out infinite; transform-origin: 80px 70px; }
    .burst-2 { animation: heartBurst 2.6s ease-out infinite 0.6s; transform-origin: 200px 60px; }
    .burst-3 { animation: heartBurst 2.4s ease-out infinite 1.1s; transform-origin: 140px 40px; }
  </style>

  <circle cx="140" cy="120" r="105" fill="url(#victoryGlow)" />

  <!-- Floating Victory Hearts -->
  <g class="burst-1">
    <path d="M80,70 C80,62 88,58 94,64 C100,70 100,78 88,88 L80,94 L72,88 C60,78 60,70 66,64 C72,58 80,62 80,70 Z" fill="url(#rubyGrad)" />
  </g>
  <g class="burst-2">
    <path d="M200,60 C200,52 208,48 214,54 C220,60 220,68 208,78 L200,84 L192,78 C180,68 180,60 186,54 C192,48 200,52 200,60 Z" fill="#ffd166" />
  </g>
  <g class="burst-3">
    <path d="M140,40 C140,34 146,30 151,35 C156,40 156,46 146,54 L140,59 L134,54 C124,46 124,40 129,35 C134,30 140,34 140,40 Z" fill="#ff0a54" />
  </g>

  <!-- Happy Dancing Cupid -->
  <g class="cupid-cheer">
    <!-- Wings Spread High -->
    <path d="M100,105 C70,75 50,85 45,108 C42,122 55,135 80,135 Z" fill="url(#cupidWing)" opacity="0.95"/>
    <path d="M180,105 C210,75 230,85 235,108 C238,122 225,135 200,135 Z" fill="url(#cupidWing)" opacity="0.95"/>

    <!-- Chubby Body -->
    <ellipse cx="140" cy="148" rx="35" ry="40" fill="url(#cupidSkin)"/>
    <path d="M115,160 Q140,192 165,160 Q172,176 158,186 Q140,194 122,186 Q108,176 115,160 Z" fill="#ffffff"/>

    <!-- Arms Raised in Celebration Hug -->
    <path d="M112,135 Q96,110 108,92" fill="none" stroke="url(#cupidSkin)" stroke-width="12" stroke-linecap="round"/>
    <path d="M168,135 Q184,110 172,92" fill="none" stroke="url(#cupidSkin)" stroke-width="12" stroke-linecap="round"/>

    <!-- Big Center Love Heart -->
    <path d="M140,135 C140,120 155,110 166,122 C176,133 176,148 155,165 L140,178 L125,165 C104,148 104,133 114,122 C125,110 140,120 140,135 Z" fill="url(#rubyGrad)" filter="drop-shadow(0 4px 10px rgba(255,10,84,0.5))"/>

    <!-- Head & Cheerful Face -->
    <circle cx="140" cy="88" r="32" fill="url(#cupidSkin)"/>
    <!-- Blushing Cheeks -->
    <ellipse cx="120" cy="96" rx="9" ry="5" fill="#ff477e" opacity="0.45"/>
    <ellipse cx="160" cy="96" rx="9" ry="5" fill="#ff477e" opacity="0.45"/>
    <!-- Joyful Eyes (Crescent Smiling) -->
    <path d="M123,88 Q129,82 135,88" fill="none" stroke="#6b2d5c" stroke-width="3" stroke-linecap="round"/>
    <path d="M145,88 Q151,82 157,88" fill="none" stroke="#6b2d5c" stroke-width="3" stroke-linecap="round"/>
    <!-- Open Happy Mouth -->
    <path d="M133,98 Q140,110 147,98 Z" fill="#e0407b"/>

    <!-- Curly Golden Hair -->
    <circle cx="124" cy="64" r="13" fill="url(#cupidHair)"/>
    <circle cx="140" cy="58" r="15" fill="url(#cupidHair)"/>
    <circle cx="156" cy="64" r="13" fill="url(#cupidHair)"/>
    <!-- Golden Halo -->
    <ellipse cx="140" cy="50" rx="24" ry="8" fill="none" stroke="url(#goldBow)" stroke-width="4"/>
  </g>
</svg>
