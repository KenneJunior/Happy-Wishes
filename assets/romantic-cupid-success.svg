<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240" role="img" aria-label="Romantic cupid celebration illustration">
  <defs>
    <!-- Backdrop -->
    <radialGradient id="rcp-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF9E8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#FFE6EE" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#FFD4E0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rcp-halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFF7D4" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#F7C766" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rcp-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C182B" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#5C182B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5C182B" stop-opacity="0"/>
    </radialGradient>

    <!-- Skin -->
    <linearGradient id="rcp-skin" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FFFBF7"/>
      <stop offset="0.4" stop-color="#FCE6DA"/>
      <stop offset="0.8" stop-color="#F3BFAD"/>
      <stop offset="1" stop-color="#D68E78"/>
    </linearGradient>

    <linearGradient id="rcp-skin-shade" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F6C7B7"/>
      <stop offset="0.6" stop-color="#E39B87"/>
      <stop offset="1" stop-color="#B96E5B"/>
    </linearGradient>

    <radialGradient id="rcp-blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F26E88" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#F791A4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FBB8C4" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair (soft golden) -->
    <linearGradient id="rcp-hair" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.4" stop-color="#F5C25A"/>
      <stop offset="0.75" stop-color="#D08228"/>
      <stop offset="1" stop-color="#8A4A0F"/>
    </linearGradient>

    <linearGradient id="rcp-hair-curl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="0.5" stop-color="#E59A2D"/>
      <stop offset="1" stop-color="#9E5512"/>
    </linearGradient>

    <!-- Wings -->
    <linearGradient id="rcp-wing" x1="0" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFF6F9"/>
      <stop offset="0.8" stop-color="#FAC9D6"/>
      <stop offset="1" stop-color="#D98FA3"/>
    </linearGradient>

    <linearGradient id="rcp-wing-inner" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FEF1F4"/>
      <stop offset="1" stop-color="#E7CDD6"/>
    </linearGradient>

    <linearGradient id="rcp-wing-rib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F8C6D2" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="rcp-gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF8D4"/>
      <stop offset="0.3" stop-color="#F7CF69"/>
      <stop offset="0.7" stop-color="#D99B22"/>
      <stop offset="1" stop-color="#8E5508"/>
    </linearGradient>

    <!-- Ruby heart -->
    <radialGradient id="rcp-ruby" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F85A7A"/>
      <stop offset="0.35" stop-color="#C4102F"/>
      <stop offset="0.75" stop-color="#750117"/>
      <stop offset="1" stop-color="#3A0007"/>
    </radialGradient>

    <linearGradient id="rcp-ruby-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9E1"/>
      <stop offset="0.4" stop-color="#F07C93"/>
      <stop offset="0.75" stop-color="#F7CF69"/>
      <stop offset="1" stop-color="#8A0A22"/>
    </linearGradient>

    <!-- Sash -->
    <linearGradient id="rcp-sash" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFF3F6"/>
      <stop offset="1" stop-color="#F5C4D2"/>
    </linearGradient>

    <filter id="rcp-lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5C182B" flood-opacity="0.16"/>
    </filter>

    <style>
      @keyframes rcpEnter {
      0%   { transform: translateY(16px) scale(0.9); opacity: 0; }
      40%  { transform: translateY(-10px) scale(1.06); opacity: 1; }
      70%  { transform: translateY(-2px) scale(0.99); }
      100% { transform: translateY(-3px) scale(1); opacity: 1; }
      }
      @keyframes rcpBreathe {
      0%, 100% { transform: translateY(-3px) scale(1); }
      50%      { transform: translateY(-7px) scale(1.014); }
      }
      @keyframes rcpShadowEnter {
      0%   { transform: scale(0.9, 0.86); opacity: 0.5; }
      40%  { transform: scale(0.82, 0.78); opacity: 0.4; }
      100% { transform: scale(1, 1); opacity: 0.95; }
      }
      @keyframes rcpShadowBreathe {
      0%, 100% { transform: scale(1, 1); opacity: 0.95; }
      50%      { transform: scale(0.85, 0.8); opacity: 0.5; }
      }
      @keyframes rcpWingsOpen {
      0%   { transform: scaleY(0.9) scaleX(0.94); opacity: 0; }
      40%  { transform: scaleY(1.08) scaleX(1.03); opacity: 1; }
      100% { transform: scaleY(1) scaleX(1); opacity: 1; }
      }
      @keyframes rcpHeartPulse {
      0%   { transform: scale(0.82); }
      40%  { transform: scale(1.09); }
      100% { transform: scale(1); }
      }
      @keyframes rcpHeartRest {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.026); }
      }
      @keyframes rcpHalo {
      0%   { transform: scale(0.6); opacity: 0; }
      50%  { transform: scale(1.16); opacity: 0.9; }
      100% { transform: scale(1); opacity: 0.7; }
      }
      @keyframes rcpPop {
      0%   { transform: scale(0) rotate(0deg); opacity: 0; }
      50%  { transform: scale(1.3) rotate(20deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      }
      @keyframes rcpTwinkle {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50%      { opacity: 1; transform: scale(1.2); }
      }

      .rcp-container {
      animation: rcpEnter 1.4s cubic-bezier(0.2, 0.9, 0.3, 1.15) forwards,
      rcpBreathe 5.2s cubic-bezier(0.42, 0, 0.58, 1) infinite 1.4s;
      transform-origin: 140px 140px;
      }
      .rcp-shadow {
      animation: rcpShadowEnter 1.4s cubic-bezier(0.2, 0.9, 0.3, 1.15) forwards,
      rcpShadowBreathe 5.2s cubic-bezier(0.42, 0, 0.58, 1) infinite 1.4s;
      transform-origin: 140px 218px;
      }
      .rcp-wings {
      animation: rcpWingsOpen 1.5s ease-out forwards;
      transform-origin: 140px 118px;
      }
      .rcp-heart {
      animation: rcpHeartPulse 1.4s cubic-bezier(0.2, 0.9, 0.3, 1.15) forwards,
      rcpHeartRest 4.6s ease-in-out infinite 1.4s;
      transform-origin: 140px 148px;
      }
      .rcp-halo {
      animation: rcpHalo 1.5s ease-out forwards;
      transform-origin: 140px 48px;
      }
      .rcp-star-a {
      animation: rcpPop 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.35s;
      transform-origin: 66px 58px;
      }
      .rcp-star-b {
      animation: rcpPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.55s;
      transform-origin: 214px 54px;
      }
      .rcp-star-c {
      animation: rcpPop 1.15s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.75s;
      transform-origin: 226px 148px;
      }
      .rcp-tw {
      animation: rcpTwinkle 3.2s ease-in-out infinite;
      transform-origin: 148px 90px;
      }

      @media (prefers-reduced-motion: reduce) {
      .rcp-container, .rcp-shadow, .rcp-wings, .rcp-heart, .rcp-halo,
      .rcp-star-a, .rcp-star-b, .rcp-star-c, .rcp-tw {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
      }
      }
    </style>
  </defs>

  <!-- Backdrop -->
  <circle cx="140" cy="116" r="106" fill="url(#rcp-aura)"/>
  <circle class="rcp-halo" cx="140" cy="48" r="46" fill="url(#rcp-halo)"/>

  <!-- Ground shadow -->
  <ellipse class="rcp-shadow" cx="140" cy="218" rx="48" ry="7.5" fill="url(#rcp-shadow)"/>

  <!-- Ambient stars -->
  <g class="rcp-star-a">
    <path d="M 66 50 C 67 56 68 57 74 58 C 68 59 67 60 66 66 C 65 60 64 59 58 58 C 64 57 65 56 66 50 Z" fill="url(#rcp-gold)"/>
  </g>
  <g class="rcp-star-b">
    <path d="M 214 46 C 215 52 216 53 222 54 C 216 55 215 56 214 62 C 213 56 212 55 206 54 C 212 53 213 52 214 46 Z" fill="url(#rcp-gold)"/>
  </g>
  <g class="rcp-star-c">
    <path d="M 226 140 C 227 145 228 146 233 147 C 228 148 227 149 226 154 C 225 149 224 148 219 147 C 224 146 225 145 226 140 Z" fill="url(#rcp-gold)"/>
  </g>
  <circle cx="52" cy="120" r="1.8" fill="#F7CF69" opacity="0.55"/>
  <circle cx="236" cy="102" r="1.5" fill="#F7CF69" opacity="0.45"/>

  <!-- Master cupid -->
  <g class="rcp-container" filter="url(#rcp-lift)">

    <!-- ── Wings ─────────────────────────────────────── -->
    <g class="rcp-wings">

      <!-- LEFT WING -->
      <g>
        <!-- Outer flight feathers -->
        <path d="M 108 112 C 78 78 44 74 34 96 C 26 116 40 140 74 142 C 92 143 104 128 108 112 Z" fill="url(#rcp-wing)"/>
        <!-- Second tier -->
        <path d="M 104 118 C 80 92 54 94 46 112 C 42 126 58 138 84 136 C 96 135 102 126 104 118 Z" fill="url(#rcp-wing-inner)"/>
        <!-- Coverts -->
        <path d="M 100 122 C 84 108 68 110 62 122 C 60 132 76 138 92 134 C 98 132 100 126 100 122 Z" fill="#FFFFFF"/>
        <!-- Feather rib lines -->
        <path d="M 100 116 C 78 100 58 106 52 118" fill="none" stroke="url(#rcp-wing-rib)" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M 100 124 C 86 116 72 120 66 128" fill="none" stroke="#F8C6D2" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
        <path d="M 106 110 C 92 92 74 88 62 96" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
        <!-- Tip highlight -->
        <path d="M 38 96 C 44 90 54 90 62 96" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- RIGHT WING -->
      <g>
        <path d="M 172 112 C 202 78 236 74 246 96 C 254 116 240 140 206 142 C 188 143 176 128 172 112 Z" fill="url(#rcp-wing)"/>
        <path d="M 176 118 C 200 92 226 94 234 112 C 238 126 222 138 196 136 C 184 135 178 126 176 118 Z" fill="url(#rcp-wing-inner)"/>
        <path d="M 180 122 C 196 108 212 110 218 122 C 220 132 204 138 188 134 C 182 132 180 126 180 122 Z" fill="#FFFFFF"/>
        <path d="M 180 116 C 202 100 222 106 228 118" fill="none" stroke="url(#rcp-wing-rib)" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M 180 124 C 194 116 208 120 214 128" fill="none" stroke="#F8C6D2" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
        <path d="M 174 110 C 188 92 206 88 218 96" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
        <path d="M 242 96 C 236 90 226 90 218 96" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
      </g>
    </g>

    <!-- ── Legs (tucked, floating) ───────────────────── -->
    <path d="M 126 172 C 118 176 114 186 120 194 C 126 200 136 198 140 192 C 142 186 138 178 132 174 Z" fill="url(#rcp-skin-shade)"/>
    <ellipse cx="124" cy="193" rx="6" ry="4.4" fill="url(#rcp-skin-shade)" transform="rotate(-16 124 193)"/>

    <path d="M 154 172 C 162 176 166 186 160 194 C 154 200 144 198 140 192 C 138 186 142 178 148 174 Z" fill="url(#rcp-skin)"/>
    <ellipse cx="156" cy="193" rx="6.2" ry="4.6" fill="url(#rcp-skin)" transform="rotate(16 156 193)"/>
    <circle cx="161" cy="192" r="1.2" fill="#F3BEAE"/>
    <circle cx="160" cy="194.6" r="1" fill="#F3BEAE"/>

    <!-- ── Torso ─────────────────────────────────────── -->
    <path d="M 124 126 C 136 122 144 122 156 126 C 166 136 166 152 158 170 C 150 180 130 180 122 170 C 114 152 114 136 124 126 Z" fill="url(#rcp-skin)"/>
    <ellipse cx="140" cy="140" rx="10" ry="6.5" fill="#FFFFFF" opacity="0.28"/>
    <circle cx="140" cy="160" r="8" fill="url(#rcp-blush)" opacity="0.45"/>

    <!-- ── Sash ──────────────────────────────────────── -->
    <path d="M 116 164 Q 140 194 164 164 Q 170 180 156 188 Q 140 196 124 188 Q 112 178 116 164 Z"
          fill="url(#rcp-sash)" stroke="#F7CF69" stroke-width="0.8"/>
    <path d="M 120 167 Q 140 190 160 167" fill="none" stroke="#F7CF69" stroke-width="1" opacity="0.85"/>

    <!-- ── Ruby heart centerpiece ───────────────────── -->
    <g class="rcp-heart">
      <path d="M 140 132 C 140 108 170 94 190 114 C 210 134 208 156 166 180 L 140 198 L 114 180 C 72 156 70 134 90 114 C 110 94 140 108 140 132 Z"
            fill="url(#rcp-ruby)"/>

      <path d="M 140 132 C 140 108 170 94 190 114 C 210 134 208 156 166 180 L 140 198 L 114 180 C 72 156 70 134 90 114 C 110 94 140 108 140 132 Z"
            fill="none" stroke="url(#rcp-ruby-rim)" stroke-width="1.6" opacity="0.85"/>

      <!-- Inner glow facet -->
      <path d="M 140 142 C 140 128 156 120 168 130 C 178 140 176 152 154 164 L 140 174 L 126 164 C 104 152 102 140 112 130 C 124 120 140 128 140 142 Z"
            fill="#FF5B7B" opacity="0.42"/>

      <!-- Facet lines -->
      <path d="M 140 132 L 140 198" stroke="#4A000A" stroke-width="0.6" opacity="0.35"/>
      <path d="M 92 116 C 110 130 118 150 116 176" stroke="#4A000A" stroke-width="0.5" opacity="0.28"/>
      <path d="M 188 116 C 170 130 162 150 164 176" stroke="#4A000A" stroke-width="0.5" opacity="0.28"/>

      <!-- Specular highlight -->
      <path d="M 116 124 C 110 132 108 144 112 154" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
      <circle cx="120" cy="120" r="2.2" fill="#FFFFFF"/>
      <circle cx="114" cy="130" r="1.2" fill="#FFFFFF" opacity="0.9"/>
      <path d="M 168 138 C 172 144 172 152 170 160" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.35"/>

      <!-- Gold rim accent on top lobes -->
      <path d="M 118 118 C 128 108 138 110 140 122" stroke="url(#rcp-gold)" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M 162 118 C 152 108 142 110 140 122" stroke="url(#rcp-gold)" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round"/>

      <!-- Twinkle -->
      <g class="rcp-tw">
        <circle cx="148" cy="90" r="1.6" fill="#FFFFFF" opacity="0.9"/>
      </g>
    </g>

    <!-- ── Arms hugging the heart ────────────────────── -->
    <path d="M 118 132 C 104 136 98 148 106 158 C 114 168 124 164 132 158"
          fill="none" stroke="url(#rcp-skin)" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="132" cy="158" rx="5" ry="4.2" fill="url(#rcp-skin)"/>
    <path d="M 130 156 C 132 155 134 157 133 160 C 132 162 130 162 129 161"
          fill="none" stroke="#D68E78" stroke-width="1.2" stroke-linecap="round"/>

    <path d="M 162 132 C 176 136 182 148 174 158 C 166 168 156 164 148 158"
          fill="none" stroke="url(#rcp-skin)" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="148" cy="158" rx="5" ry="4.2" fill="url(#rcp-skin)"/>
    <path d="M 150 156 C 148 155 146 157 147 160 C 148 162 150 162 151 161"
          fill="none" stroke="#D68E78" stroke-width="1.2" stroke-linecap="round"/>

    <!-- ── Head, curls, face ─────────────────────────── -->
    <g transform="translate(140, 88)">
      <!-- Head shape -->
      <path d="M -19 -4 C -21 12 -12 26 0 27 C 12 26 21 12 19 -4 C 19 -18 12 -26 0 -26 C -12 -26 -19 -18 -19 -4 Z"
            fill="url(#rcp-skin)"/>
      <ellipse cx="0" cy="-10" rx="12" ry="7" fill="#FFFFFF" opacity="0.3"/>

      <!-- Cheeks -->
      <ellipse cx="-13" cy="7" rx="7" ry="4.2" fill="url(#rcp-blush)"/>
      <ellipse cx="13" cy="7" rx="7" ry="4.2" fill="url(#rcp-blush)"/>

      <!-- Closed smiling eyes -->
      <path d="M -15 1 C -13 -4 -8 -4 -5 1" fill="none" stroke="#4A1525" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M -15.5 3.2 C -13 1 -10 1 -7.5 3.6" fill="none" stroke="#4A1525" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
      <path d="M 5 1 C 8 -4 13 -4 15 1" fill="none" stroke="#4A1525" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 7.5 3.6 C 10 1 13 1 15.5 3.2" fill="none" stroke="#4A1525" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>

      <!-- Brows -->
      <path d="M -15 -6 C -12 -8.5 -8 -8.5 -5 -6" fill="none" stroke="#C47829" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
      <path d="M 5 -6 C 8 -8.5 12 -8.5 15 -6" fill="none" stroke="#C47829" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

      <!-- Nose -->
      <path d="M -1 4 C 0 5.6 1 5.6 2 4.6" fill="none" stroke="#D17E6B" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Mouth -->
      <path d="M -5 12 C -2 17.5 2 17.5 5 12 Z" fill="#A81229"/>
      <path d="M -3 13 C -1 16 1 16 3 13 Z" fill="#F08096"/>
      <path d="M -4 11.6 C -1 12.6 1 12.6 4 11.6" fill="none" stroke="#4A1525" stroke-width="0.8" opacity="0.5"/>

      <!-- Curls -->
      <circle cx="-16" cy="-18" r="9.5" fill="url(#rcp-hair)"/>
      <circle cx="16" cy="-18" r="9.5" fill="url(#rcp-hair)"/>
      <circle cx="0" cy="-25" r="11.5" fill="url(#rcp-hair)"/>
      <circle cx="-19" cy="-8" r="7" fill="url(#rcp-hair-curl)"/>
      <circle cx="19" cy="-8" r="7" fill="url(#rcp-hair-curl)"/>
      <path d="M -13 -18 C -19 -6 -7 -5 -5 -14 Z" fill="url(#rcp-hair-curl)"/>
      <path d="M 5 -20 C -1 -8 13 -6 9 -15 Z" fill="url(#rcp-hair-curl)"/>
      <circle cx="-7" cy="-20" r="8.5" fill="url(#rcp-hair-curl)"/>
      <circle cx="7" cy="-20" r="8.5" fill="url(#rcp-hair-curl)"/>

      <!-- Hair strand highlights -->
      <path d="M -12 -25 C -6 -28.5 6 -28.5 12 -25" fill="none" stroke="#FFF3B0" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
      <path d="M -4 -27 C 0 -29 4 -29 8 -27" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
      <path d="M -18 -14 C -20 -10 -19 -5 -16 -2" fill="none" stroke="#FFF3B0" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
      <path d="M 18 -14 C 20 -10 19 -5 16 -2" fill="none" stroke="#FFF3B0" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

      <!-- Halo ring -->
      <ellipse cx="0" cy="-35" rx="22" ry="6.8" fill="none" stroke="url(#rcp-gold)" stroke-width="2.6"/>
      <ellipse cx="0" cy="-35" rx="22" ry="6.8" fill="none" stroke="#FFF7D4" stroke-width="0.8" opacity="0.7"/>
      <circle cx="15" cy="-34.4" r="1.7" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="-15" cy="-34.4" r="1.2" fill="#FFF7D4"/>
      <circle cx="0" cy="-37" r="1" fill="#FFFFFF" opacity="0.75"/>
    </g>
  </g>
</svg>