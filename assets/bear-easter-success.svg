<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 240" width="280" height="240">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#fae8eb"/>
    </linearGradient>

    <radialGradient id="bellyGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#fedce5"/>
    </radialGradient>

    <linearGradient id="innerEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffccd5"/>
      <stop offset="100%" stop-color="#ff7597"/>
    </linearGradient>

    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff758f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffccd5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bunnyEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fbf0f3"/>
      <stop offset="100%" stop-color="#f8d7e0"/>
    </linearGradient>

    <linearGradient id="springGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <filter id="springSuccessGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#f472b6" flood-opacity="0.2"/>
    </filter>

    <style>
      @keyframes victorySpringJump {
        0% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
        9% { transform: translateY(12px) scale(1.16, 0.84) rotate(0deg); }
        22% { transform: translateY(-18px) scale(0.88, 1.16) rotate(1deg); }
        36% { transform: translateY(-48px) scale(0.93, 1.09) rotate(2deg); }
        48% { transform: translateY(-52px) scale(1.02, 0.98) rotate(0.6deg); }
        64% { transform: translateY(-14px) scale(0.89, 1.14) rotate(-0.8deg); }
        74% { transform: translateY(14px) scale(1.26, 0.74) rotate(0deg); }
        84% { transform: translateY(-12px) scale(0.92, 1.1) rotate(-0.5deg); }
        92% { transform: translateY(4px) scale(1.05, 0.96) rotate(0.2deg); }
        100% { transform: translateY(0px) scale(1, 1) rotate(0deg); }
      }

      @keyframes groundShadowSpring {
        0% { transform: scale(1, 1); opacity: 0.38; }
        9% { transform: scale(1.3, 1.25); opacity: 0.55; }
        22% { transform: scale(0.72, 0.66); opacity: 0.18; }
        36%, 48% { transform: scale(0.42, 0.38); opacity: 0.08; }
        64% { transform: scale(0.78, 0.72); opacity: 0.2; }
        74% { transform: scale(1.38, 1.32); opacity: 0.65; }
        84% { transform: scale(0.84, 0.8); opacity: 0.24; }
        92% { transform: scale(1.08, 1.05); opacity: 0.44; }
        100% { transform: scale(1, 1); opacity: 0.38; }
      }

      @keyframes victoryCheerL {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(18deg); }
      }

      @keyframes victoryCheerR {
        0%, 100% { transform: rotate(10deg); }
        50% { transform: rotate(-18deg); }
      }

      @keyframes confettiPop {
        0% { transform: scale(0) rotate(0deg); opacity: 0; }
        40% { transform: scale(1.2) rotate(90deg); opacity: 1; }
        100% { transform: scale(1) rotate(180deg); opacity: 0.8; }
      }

      .bear-jumping-rig {
        transform-origin: 140px 214px;
        animation: victorySpringJump 1.25s cubic-bezier(0.42, 0, 0.58, 1) infinite;
        will-change: transform;
      }

      .ground-shadow {
        transform-origin: 140px 222px;
        animation: groundShadowSpring 1.25s cubic-bezier(0.42, 0, 0.58, 1) infinite;
        will-change: transform, opacity;
      }

      .arm-left-wave {
        transform-origin: 104px 148px;
        animation: victoryCheerL 0.65s ease-in-out infinite alternate;
      }

      .arm-right-wave {
        transform-origin: 176px 148px;
        animation: victoryCheerR 0.65s ease-in-out infinite alternate;
      }

      .spring-star {
        animation: confettiPop 1.6s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <!-- Spring Sparkles & Confetti -->
  <g id="sparkles-bg">
    <polygon class="spring-star" points="40,24 43,32 51,35 43,38 40,46 37,38 29,35 37,32" fill="#facc15" style="animation-delay: 0.2s;"/>
    <polygon class="spring-star" points="240,30 243,38 251,41 243,44 240,52 237,44 229,41 237,38" fill="#f472b6" style="animation-delay: 0.5s;"/>
    <circle cx="55" cy="70" r="4" fill="#a855f7" opacity="0.8"/>
    <circle cx="225" cy="75" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="140" cy="20" r="5" fill="#4ade80" opacity="0.8"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse class="ground-shadow" cx="140" cy="222" rx="48" ry="9" fill="#9333ea" opacity="0.25"/>

  <!-- Jumping Bear -->
  <g class="bear-jumping-rig" filter="url(#springSuccessGlow)">

    <!-- Feet -->
    <g id="feet">
      <ellipse cx="114" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#f5c2ce" stroke-width="2"/>
      <ellipse cx="114" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="109" cy="198" r="2" fill="#ff7597"/>
      <circle cx="114" cy="196" r="2" fill="#ff7597"/>
      <circle cx="119" cy="198" r="2" fill="#ff7597"/>

      <ellipse cx="166" cy="204" rx="17" ry="13" fill="url(#furGrad)" stroke="#f5c2ce" stroke-width="2"/>
      <ellipse cx="166" cy="205" rx="8" ry="6" fill="url(#innerEarGrad)"/>
      <circle cx="161" cy="198" r="2" fill="#ff7597"/>
      <circle cx="166" cy="196" r="2" fill="#ff7597"/>
      <circle cx="171" cy="198" r="2" fill="#ff7597"/>
    </g>

    <!-- Body -->
    <ellipse cx="140" cy="166" rx="46" ry="40" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <ellipse cx="140" cy="170" rx="30" ry="25" fill="url(#bellyGrad)"/>
    <ellipse cx="140" cy="153" rx="18" ry="4.5" fill="#ffffff" opacity="0.6"/>

    <!-- Left Bear Ear -->
    <circle cx="98" cy="84" r="20" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <circle cx="98" cy="84" r="11" fill="url(#innerEarGrad)"/>

    <!-- Right Bear Ear -->
    <circle cx="182" cy="84" r="20" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <circle cx="182" cy="84" r="11" fill="url(#innerEarGrad)"/>

    <!-- Head -->
    <circle cx="140" cy="116" r="48" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2.5"/>
    <ellipse cx="140" cy="95" rx="28" ry="14" fill="#ffffff" opacity="0.45"/>

    <!-- Bunny Ears Raised in Victory! -->
    <g>
      <!-- Left Bunny Ear -->
      <path d="M 112 75 C 96 38 88 10 102 6 C 116 2 124 32 122 72 Z" fill="url(#bunnyEarGrad)" stroke="#f2bdca" stroke-width="2"/>
      <path d="M 110 68 C 100 40 94 18 102 15 C 110 12 116 34 117 66 Z" fill="url(#innerEarGrad)"/>
      <!-- Right Bunny Ear -->
      <path d="M 168 75 C 184 38 192 10 178 6 C 164 2 156 32 158 72 Z" fill="url(#bunnyEarGrad)" stroke="#f2bdca" stroke-width="2"/>
      <path d="M 170 68 C 180 40 186 18 178 15 C 170 12 164 34 163 66 Z" fill="url(#innerEarGrad)"/>
      <!-- Floral Headband Crown -->
      <path d="M 104 80 Q 140 68 176 80" fill="none" stroke="#e879f9" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="140" cy="71" r="6" fill="#fde047"/>
      <circle cx="140" cy="71" r="2.5" fill="#ffffff"/>
      <circle cx="124" cy="74" r="4.5" fill="#f472b6"/>
      <circle cx="156" cy="74" r="4.5" fill="#38bdf8"/>
    </g>

    <!-- Joyful Happy Eyes (Arcs: ^ _ ^) -->
    <path d="M 112 116 Q 120 107 128 116" fill="none" stroke="#2b1029" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 152 116 Q 160 107 168 116" fill="none" stroke="#2b1029" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cheerful Blushing Cheeks -->
    <ellipse cx="106" cy="126" rx="12" ry="7.5" fill="url(#blushGrad)"/>
    <ellipse cx="174" cy="126" rx="12" ry="7.5" fill="url(#blushGrad)"/>

    <!-- Snout & Big Joyful Smile -->
    <ellipse cx="140" cy="128" rx="15" ry="11" fill="#ffffff" stroke="#f5c2ce" stroke-width="1.5"/>
    <path d="M 135 124 C 137 121 143 121 145 124 C 146 126 142 129 140 129 C 138 129 134 126 135 124 Z" fill="#ff4d6d"/>
    <path d="M 140 129 L 140 133" stroke="#ff7597" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Big Open Smile with Pink Tongue -->
    <path d="M 132 133 Q 140 144 148 133 Z" fill="#ff4d6d" stroke="#d90429" stroke-width="1.2"/>
    <path d="M 136 139 Q 140 144 144 139" fill="#ff85a1"/>

    <!-- Arms Raised Up in Joyful Victory! -->
    <!-- Left Arm with Spring Tulip -->
    <g class="arm-left-wave">
      <path d="M 104 150 C 90 134 76 114 90 104 C 102 96 112 124 104 150 Z" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2"/>
      <circle cx="88" cy="106" r="6" fill="url(#innerEarGrad)"/>
      <!-- Spring Tulip -->
      <path d="M 88 106 L 82 86" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 76 84 C 76 72 88 72 88 84 Z" fill="#f43f5e"/>
      <path d="M 80 84 C 80 74 92 74 92 84 Z" fill="#ec4899"/>
    </g>

    <!-- Right Arm with Spring Daisy -->
    <g class="arm-right-wave">
      <path d="M 176 150 C 190 134 204 114 190 104 C 178 96 168 124 176 150 Z" fill="url(#furGrad)" stroke="#f2bdca" stroke-width="2"/>
      <circle cx="192" cy="106" r="6" fill="url(#innerEarGrad)"/>
      <!-- Daisy Flower -->
      <path d="M 192 106 L 198 86" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="198" cy="84" r="7" fill="#ffffff" stroke="#facc15" stroke-width="1"/>
      <circle cx="198" cy="84" r="3.5" fill="#facc15"/>
    </g>

  </g>
</svg>
